<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot a Vibe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="header">
    <h1> Spot-a-Vibe</h1>


    <p> Center Yourself In Front of the Camera</p>
    </div>


    <!-- Camera -->
     <main id ="camera">

         <!-- Camera Sensor-->
        <canvas id= "camera--sensor">
        </canvas>

        <!-- Camera View-->
         <video id="camera--view" autoplay 
         playsinline></video>

       

        <!--Camera Output -->
        <image src = "//:0" alt=""
        id="camera--output"></image>
     
        <!-- Capture Button -->
        <button id="camera--capture">Capture</button>
     </main>

     

    <script src="index.js"></script>
</body>
</html>
