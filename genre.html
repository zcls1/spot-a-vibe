
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Vibe - Spot-a-Vibe</title>
    <link rel="stylesheet" href="genre.css">
</head>
<body>

    <header id="header">
        <h1>Spot-a-Vibe</h1>
    </header>

    <main id="genre--page">

        <section id="genre--result">
            <p id="result--label">YOUR VIBE IS</p>
            <h2 id="genre--name">Indie Pop</h2>
            
        
        </section>

        <section id="song--card">
            <img
                id="song--cover"
                src="https://placehold.co/300x300/252525/FFFFFF?text=Album+Cover"
                alt="Song album cover"
            >

            <div id="song--info">
                <h3 id="song--title">Song Title</h3>
                <p id="song--artist">Artist Name</p>
                <p id="song--genre">Genre: Indie Pop</p>
            </div>
        </section>

        <button id="scan--again" onclick="window.location.href='index.html'">
            Scan Again
        </button>

    </main>

</body>
</html>
